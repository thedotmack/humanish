app = "humanish-box"
primary_region = "sjc"

[build]
  # Path relative to the fly.toml directory (packages/box/).
  # Deploy command: `flyctl deploy --config packages/box/fly.toml`
  # invoked from the repo root, with build context set via --image-context.
  dockerfile = "Dockerfile"

# Encrypted profile blobs + audit log live on this volume so they
# survive machine restarts and image redeploys.
[[mounts]]
  source = "humanish_data"
  destination = "/data"

# -------- action runner: public TLS, shared-secret gated --------
# 7654 (internal) is the action runner. Cloudflare Workers cannot reach
# Fly's private Flycast hostnames, so we expose it on port 8443 publicly
# with TLS termination at fly-proxy. The actual defense is the
# BOX_SHARED_SECRET bearer check inside server.ts (constant-time compare)
# — every route except /healthz requires it. No path on this port is ever
# served unauthenticated except /healthz.
[[services]]
  internal_port = 7654
  protocol = "tcp"

  [[services.ports]]
    port = 8443
    handlers = ["tls"]

# -------- neko: public --------
# 8080 is the neko UI (WebRTC + HTTP). The dashboard embeds it in an
# authenticated iframe; the password is plumbed via the embed URL hash
# at runtime so we never expose it server-side.
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
