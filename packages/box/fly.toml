app = "humanish-box"
primary_region = "sjc"

[build]
  # Path relative to the repo root — `fly deploy -c packages/box/fly.toml`
  # is invoked from the repo root.
  dockerfile = "packages/box/Dockerfile"

# Encrypted profile blobs + audit log live on this volume so they
# survive machine restarts and image redeploys.
[[mounts]]
  source = "humanish_data"
  destination = "/data"

# -------- action runner: Flycast only --------
# 7654 is the action runner. We deliberately do NOT set any handlers
# on this port — no `http`, no `tls`. That means it is reachable only
# from inside the Fly private network (Flycast) by the broker.
# The internet cannot route packets to this port at all.
[[services]]
  internal_port = 7654
  protocol = "tcp"

  [[services.ports]]
    port = 7654
    # handlers intentionally empty.

# -------- neko: public --------
# 8080 is the neko UI (WebRTC + HTTP). The dashboard embeds it in an
# authenticated iframe; the password is plumbed via the embed URL hash
# at runtime so we never expose it server-side.
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
