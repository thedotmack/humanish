; Supervisord program definition for the humanish action runner.
; Dropped into /etc/neko/supervisord/ which is included by the upstream
; neko/chromium image's /etc/neko/supervisord.conf [include] block.
;
; Priority 900 means the runner starts AFTER neko itself (priority 800),
; so the CDP socket on 127.0.0.1:9223 is already bound by the time the
; runner tries to attach for storageState capture / reauth.

[program:action-runner]
environment=HOME="/root",NODE_ENV="production"
command=/usr/bin/node /opt/action-runner/dist/server.js
autorestart=true
priority=900
user=root
stdout_logfile=/var/log/neko/action-runner.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
