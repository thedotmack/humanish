# neko v3 configuration.
#
# IMPORTANT: env var interpolation syntax in neko configs varies between
# minor versions. Some channels accept `${VAR}` directly, others require
# the `${VAR:-default}` form, others want the value baked in at deploy
# time. BEFORE FIRST DEPLOY, the operator MUST verify the exact syntax
# against https://neko.m1k1o.net/docs/v3/configuration and adjust the
# two `${...}` references below if needed. If interpolation isn't
# supported in the YAML directly, set the values via NEKO_* env vars
# (which neko reads natively) and remove them from this file.

server:
  bind: ":8080"
  # Behind Fly's edge proxy — trust X-Forwarded-For for client IP logging.
  proxy: true

# Single-user mode: one operator password, no signup, no anonymous.
# Both user_password and admin_password are intentionally the same so
# every authenticated session is admin (we're not exposing this UI to
# end users — the operator is the only one who ever sees it).
member:
  provider: multiuser
  multiuser:
    user_password: ${NEKO_PASSWORD}
    admin_password: ${NEKO_PASSWORD}

session:
  # The API token gates the neko REST API (we use shared secret with the
  # action runner — the broker forwards control via the runner, not via
  # this token, but having it set hardens the back door).
  api_token: ${BOX_SHARED_SECRET}

desktop:
  screen: "1280x720@30"

# No webcam / mic in the jail — the browser doesn't get media devices.
capture:
  webcam:
    enabled: false
  microphone:
    enabled: false

# Disable neko's built-in chat and file transfer so the user can't
# exfiltrate data via the neko UI itself.
plugins:
  enabled: true
  dir: /etc/neko/plugins
  config:
    chat:
      enabled: false
    filetransfer:
      enabled: false
