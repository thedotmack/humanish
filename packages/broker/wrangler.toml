name = "humanish-broker"
main = "src/worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SLUG_NS"
class_name = "SlugBox"

[[migrations]]
tag = "v1"
new_classes = ["SlugBox"]

[[kv_namespaces]]
binding = "KV"
id = "1d108315895e4a4896a6bbe040cbdc84"

[vars]
# Box public endpoint. Cloudflare Workers cannot reach Fly's private
# `.flycast` hostnames, so we expose the action runner on a public TLS
# port (8443) and gate it with BOX_SHARED_SECRET. See packages/box/fly.toml.
BOX_ORIGIN = "https://humanish-box.fly.dev:8443"
COOKIE_DOMAIN = "humanish-broker.black-pond-afbb.workers.dev"
# FROM_EMAIL set via `wrangler secret put` so the address isn't checked in
# ALLOWED_EMAILS likewise set via secret put

# Bundle HTML pages and skill markdown templates as string modules. Lets the
# Worker `import` them directly; wrangler inlines the file contents as a
# default string export. Globs are most-specific first so the .md.template
# rule wins over the broader .template rule.
# Docs: https://developers.cloudflare.com/workers/wrangler/bundling/
[[rules]]
type = "Text"
globs = ["**/*.md.template"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.template"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
